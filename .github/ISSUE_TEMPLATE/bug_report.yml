name: Bug report
description: Report something that does not work as documented.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Security issues must not be reported here: see [SECURITY.md](https://github.com/daifma/chrome-pdf-bundle/blob/main/SECURITY.md).

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen? Include the full error message and the `BrowserException` text if there is one.
      placeholder: Describe the issue in detail...
    validations:
      required: true

  - type: textarea
    id: reproducer
    attributes:
      label: Reproducer
      description: A minimal controller action, command or test that shows the problem. Include the HTML or Twig template if the output is wrong.
      render: php
    validations:
      required: false

  - type: textarea
    id: configuration
    attributes:
      label: Bundle configuration
      description: Your `config/packages/daif_chrome_pdf.yaml` (remove secrets).
      render: yaml
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Linux container (Docker, Podman, ...)
        - Other
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Google Chrome
        - Chromium
        - Microsoft Edge
        - Other Chromium-based browser
    validations:
      required: true

  - type: input
    id: browser_version
    attributes:
      label: Browser version
      description: Output of `google-chrome --version`, `chromium --version` or the Edge version.
      placeholder: ex. 141.0.7390.54
    validations:
      required: true

  - type: input
    id: bundle_version
    attributes:
      label: ChromePdfBundle version
      description: Output of `composer show daif/chrome-pdf-bundle | grep versions`.
      placeholder: ex. 0.9.0-alpha
    validations:
      required: true

  - type: input
    id: php_version
    attributes:
      label: PHP version
      placeholder: ex. 8.3.12
    validations:
      required: true

  - type: input
    id: symfony_version
    attributes:
      label: Symfony version
      placeholder: ex. 7.3.4
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output (Symfony logs, Chrome output, stack trace).
      render: shell
    validations:
      required: false
