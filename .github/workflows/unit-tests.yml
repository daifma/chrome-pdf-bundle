name: 'Tests'

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: 'read'

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  linux:
    name: 'Linux / PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }} (${{ matrix.dependencies }})'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
        symfony: ['6.4.*', '7.*']
        dependencies: ['lowest', 'highest']
        exclude:
          # Symfony 7 requires PHP >= 8.2
          - php: '8.1'
            symfony: '7.*'
        include:
          # Symfony 8 requires PHP >= 8.4
          - php: '8.4'
            symfony: '8.*'
            dependencies: 'highest'
    env:
      # Browser and engine (qpdf, exiftool, LibreOffice) tests must run (and fail without the binaries) instead of being skipped.
      CHROME_PDF_BROWSER_TESTS: '1'
      CHROME_PDF_ENGINE_TESTS: '1'
    steps:
      - uses: 'actions/checkout@v4'

      - name: 'Setup PHP'
        uses: 'shivammathur/setup-php@v2'
        with:
          php-version: '${{ matrix.php }}'
          extensions: 'sockets, mbstring, zip'
          coverage: 'none'
          tools: 'flex'

      - name: 'Setup Chrome'
        id: 'setup-chrome'
        uses: 'browser-actions/setup-chrome@v1'
        with:
          chrome-version: 'stable'
          install-dependencies: true

      - name: 'Install qpdf, exiftool and LibreOffice'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qpdf libimage-exiftool-perl libreoffice-writer-nogui libreoffice-draw-nogui libreoffice-calc-nogui
          qpdf --version
          exiftool -ver
          soffice --version

      - name: 'Install dependencies'
        uses: 'ramsey/composer-install@v3'
        env:
          # Read by symfony/flex to restrict every symfony/* package to the tested version.
          SYMFONY_REQUIRE: '${{ matrix.symfony }}'
        with:
          dependency-versions: '${{ matrix.dependencies }}'
          composer-options: '--prefer-dist'

      - name: 'Run PHPUnit'
        env:
          CHROME_PATH: '${{ steps.setup-chrome.outputs.chrome-path }}'
        run: 'php vendor/bin/phpunit'

  windows:
    name: 'Windows / PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }}'
    runs-on: 'windows-latest'
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            symfony: '6.4.*'
          - php: '8.4'
            symfony: '7.*'
    env:
      CHROME_PDF_BROWSER_TESTS: '1'
      CHROME_PDF_ENGINE_TESTS: '1'
    steps:
      # Defensive: .gitattributes already forces LF, this also covers files without attributes.
      - name: 'Disable CRLF conversion'
        run: 'git config --global core.autocrlf false'

      - uses: 'actions/checkout@v4'

      - name: 'Setup PHP'
        uses: 'shivammathur/setup-php@v2'
        with:
          php-version: '${{ matrix.php }}'
          extensions: 'sockets, mbstring, zip, fileinfo'
          coverage: 'none'
          tools: 'flex'

      - name: 'Setup Chrome'
        id: 'setup-chrome'
        uses: 'browser-actions/setup-chrome@v1'
        with:
          chrome-version: 'stable'

      # The Chocolatey community feed regularly answers 5xx: retry each package.
      - name: 'Install qpdf, exiftool and LibreOffice'
        shell: 'pwsh'
        run: |
          foreach ($package in 'qpdf', 'exiftool', 'libreoffice-fresh') {
            for ($attempt = 1; $attempt -le 4; $attempt++) {
              choco install $package -y --no-progress
              if ($LASTEXITCODE -eq 0) { break }
              if ($attempt -eq 4) { throw "choco install $package failed" }
              Start-Sleep -Seconds (15 * $attempt)
            }
          }

      # Chocolatey updates the machine PATH, which later steps do not see: point to the binaries only when PATH lookup fails.
      - name: 'Locate qpdf, exiftool and LibreOffice'
        shell: 'pwsh'
        run: |
          $tools = @{
            'QPDF_PATH' = @('qpdf', "$env:ProgramFiles\qpdf*\bin\qpdf.exe");
            'EXIFTOOL_PATH' = @('exiftool', "$env:ProgramData\chocolatey\bin\exiftool.exe");
            'LIBREOFFICE_PATH' = @('soffice', "$env:ProgramFiles\LibreOffice\program\soffice.exe")
          }
          foreach ($name in $tools.Keys) {
            $command, $pattern = $tools[$name]
            if (Get-Command $command -ErrorAction SilentlyContinue) {
              Write-Output "$command found in PATH"
              continue
            }
            $binary = Get-ChildItem -Path $pattern -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($null -eq $binary) {
              throw "$command was not found"
            }
            Write-Output "$name=$($binary.FullName)"
            "$name=$($binary.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: 'Install dependencies'
        uses: 'ramsey/composer-install@v3'
        env:
          SYMFONY_REQUIRE: '${{ matrix.symfony }}'
        with:
          dependency-versions: 'highest'
          composer-options: '--prefer-dist'

      - name: 'Run PHPUnit'
        env:
          CHROME_PATH: '${{ steps.setup-chrome.outputs.chrome-path }}'
        run: 'php vendor/bin/phpunit'
